<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpaceChat & Video (WebRTC)</title>
  <style>
    /* Оригинальные стили интерфейса SpaceChat */
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121214;
      color: #e1e1e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h3 {
      color: #00b37e;
      margin-bottom: 20px;
    }

    /* Панель кнопок управления из вашего первого файла */
    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      background-color: #202024;
      padding: 10px 20px;
      border-radius: 8px;
    }

    .btn {
      background: none;
      border: none;
      color: #e1e1e6;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 12px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #29292e;
    }

    .btn-danger:hover {
      background-color: #f75a68;
      color: #fff;
    }

    /* Адаптивная сетка под 4 окна (Ваши стримы + стримы собеседника) */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1400px;
    }

    /* Контейнер для каждого отдельного видеопотока */
    .video-wrapper {
      position: relative;
      background-color: #000;
      border-radius: 8px;
      border: 2px solid #29292e;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      transition: border-color 0.2s;
    }

    .video-wrapper:hover {
      border-color: #00b37e; /* Подсветка окна при наведении */
    }

    /* Элемент видео, транслируемый из C# (localhost:8000) */
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
    }

    /* Правило для Fullscreen API: убирает обрезку видео при развертывании */
    video:fullscreen {
      object-fit: contain;
    }

    /* Текстовые метки для каждого из 4 окон */
    .video-label {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.75);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      z-index: 10;
      pointer-events: none; /* Клик проходит сквозь текст прямо на видео */
      border-left: 3px solid #00b37e;
    }

    /* === Панель чата и подключения к собеседнику === */
    .chat-panel {
      width: 100%;
      max-width: 1400px;
      background-color: #202024;
      border: 1px solid #29292e;
      border-radius: 8px;
      margin-top: 25px;
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #29292e;
      background-color: #18181b;
      font-size: 0.95rem;
    }

    .chat-header strong {
      color: #00b37e;
      letter-spacing: 1px;
    }

    #peer-input {
      background: #121214;
      border: 1px solid #29292e;
      color: #e1e1e6;
      padding: 6px 10px;
      border-radius: 6px;
      width: 130px;
      text-transform: uppercase;
      font-family: monospace;
      letter-spacing: 2px;
    }

    #peer-input:focus {
      outline: none;
      border-color: #00b37e;
    }

    .chat-log {
      height: 260px;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: #121214;
    }

    .msg {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 10px;
      line-height: 1.35;
      word-break: break-word;
      font-size: 0.92rem;
    }

    .msg .author {
      display: block;
      font-size: 0.72rem;
      opacity: 0.7;
      margin-bottom: 3px;
    }

    .msg.them {
      align-self: flex-start;
      background-color: #29292e;
    }

    .msg.me {
      align-self: flex-end;
      background-color: #00b37e;
      color: #04130d;
    }

    .msg.system {
      align-self: center;
      background: transparent;
      color: #8d8d99;
      font-size: 0.8rem;
      font-style: italic;
    }

    .chat-input-row {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid #29292e;
      background-color: #18181b;
    }

    #chat-input {
      flex: 1;
      background: #121214;
      border: 1px solid #29292e;
      color: #e1e1e6;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    #chat-input:focus {
      outline: none;
      border-color: #00b37e;
    }

    #chat-send {
      background-color: #00b37e;
      color: #04130d;
      font-weight: 600;
      padding: 8px 18px;
    }

    #chat-send:hover {
      background-color: #00cc8f;
    }
  </style>
</head>
<body>

  <h2>SpaceChat & Video (WebRTC)</h2>

  <!-- ВАША ОРИГИНАЛЬНАЯ СТРОКА ГЕНЕРАЦИИ ID -->
  <!-- Сюда ваша C# функция выводит сгенерированные уникальные ID для пользователей -->
  <h3 id="id-generation-display">⏳ Подключение к серверу...</h3>

  <!-- Оригинальные кнопки управления -->
  <div class="controls">
    <button id="btn-call-video" class="btn">📞 Видеозвонок</button>
    <button id="btn-call-voice" class="btn">🎤 Голосовой</button>
    <button id="btn-call-screen" class="btn">🖥 Экран</button>
    <button id="btn-reset" class="btn btn-danger">❌ Сбросить</button>
  </div>

  <!-- Сетка для 4 раздельных окон (Ваша камера + Демка и Камера + Демка второго человека) -->
  <div class="video-grid" id="video-grid">
    
    <!-- 1. Ваша личная камера -->
    <div class="video-wrapper">
      <div class="video-label">📷 Вы (Моя камера)</div>
      <video id="video-my-camera" autoplay muted loop playsinline></video>
    </div>

    <!-- 2. Ваша демонстрация экрана -->
    <div class="video-wrapper">
      <div class="video-label">🖥 Вы (Мой экран)</div>
      <video id="video-my-screen" autoplay muted loop playsinline></video>
    </div>

    <!-- 3. Камера подключившегося собеседника -->
    <div class="video-wrapper">
      <div class="video-label">👤 Собеседник (Камера)</div>
      <video id="video-peer-camera" autoplay muted loop playsinline></video>
    </div>

    <!-- 4. Демонстрация экрана собеседника -->
    <div class="video-wrapper">
      <div class="video-label">🖥 Собеседник (Экран)</div>
      <video id="video-peer-screen" autoplay muted loop playsinline></video>
    </div>

  </div>

  <p style="color: #8d8d99; font-size: 0.85rem; margin-top: 25px;">
    👉 Дважды кликните по любому из 4-х окон, чтобы открыть его на весь экран. Повторный двойной клик или Esc — выход.
  </p>

  <!-- === Панель чата и подключения к собеседнику === -->
  <div class="chat-panel">
    <div class="chat-header">
      <span>Ваш ID: <strong id="my-id">…</strong></span>
      <span>
        ID собеседника:
        <input id="peer-input" placeholder="ABC123" maxlength="6" autocomplete="off">
      </span>
    </div>

    <div id="chat-log" class="chat-log"></div>

    <div class="chat-input-row">
      <input id="chat-input" placeholder="Введите сообщение…" autocomplete="off">
      <button id="chat-send" class="btn">➤ Отправить</button>
    </div>
  </div>

  <!-- Этот скрипт работает независимо и не мешает вашей C# логике ID -->
  <script>
    // === Подключение к C# WebSocket-серверу (Program.cs, localhost:8000) ===
    const statusEl = document.getElementById('id-generation-display');
    const myIdEl = document.getElementById('my-id');
    const peerInput = document.getElementById('peer-input');
    const chatLog = document.getElementById('chat-log');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');

    let socket = null;
    let myId = null;

    function connectToServer() {
      // ws:// тот же хост/порт, что слушает Kestrel в Program.cs
      const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
      statusEl.textContent = '⏳ Подключение к серверу...';

      socket = new WebSocket(wsUrl);

      socket.addEventListener('open', () => {
        statusEl.textContent = '✅ Соединение с C# сервером установлено';
        console.log('[WS] Подключено к C# серверу');
      });

      socket.addEventListener('message', (event) => {
        handleServerMessage(event.data);
      });

      socket.addEventListener('close', () => {
        statusEl.textContent = '❌ Соединение разорвано. Переподключение...';
        myId = null;
        myIdEl.textContent = '…';
        setTimeout(connectToServer, 2000);
      });

      socket.addEventListener('error', (err) => {
        console.error('[WS] Ошибка соединения:', err);
      });
    }

    function sendToServer(data) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(typeof data === 'string' ? data : JSON.stringify(data));
      }
    }

    // === Обработка сообщений от C# сервера ===
    function handleServerMessage(raw) {
      let msg;
      try { msg = JSON.parse(raw); } catch { return; }

      switch (msg.type) {
        case 'welcome':
          myId = msg.id;
          myIdEl.textContent = myId;
          statusEl.textContent = '✅ Ваш ID: ' + myId;
          addSystemMessage('Вы подключены. Ваш ID: ' + myId);
          if (msg.peers && msg.peers.length) {
            addSystemMessage('В сети уже: ' + msg.peers.join(', '));
          }
          break;

        case 'peerJoined':
          addSystemMessage('Подключился участник: ' + msg.id);
          break;

        case 'peerLeft':
          addSystemMessage('Отключился участник: ' + msg.id);
          break;

        case 'signal':
          // WebRTC-сигналинг (offer/answer/candidate) от собеседника
          handleSignal(msg);
          break;

        case 'chat':
          // msg.from, msg.to, msg.text
          const isMine = msg.from === myId;
          addChatMessage(msg.from, msg.text, isMine ? 'me' : 'them');
          break;
      }
    }

    // === Отрисовка сообщений ===
    function addChatMessage(author, text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      const a = document.createElement('span');
      a.className = 'author';
      a.textContent = author;
      div.appendChild(a);
      div.appendChild(document.createTextNode(text));
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'msg system';
      div.textContent = text;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    // === Отправка сообщений ===
    function sendChat() {
      const text = chatInput.value.trim();
      if (!text || !myId) return;

      const target = peerInput.value.trim().toUpperCase();
      const payload = {
        type: 'chat',
        from: myId,
        to: target || null,
        text: text
      };
      sendToServer(payload);

      // Показываем своё сообщение локально (сервер его отправителю не возвращает)
      const label = target ? (target === myId ? myId : '→ ' + target) : 'всем';
      addChatMessage(label, text, 'me');

      chatInput.value = '';
    }

    chatSend.addEventListener('click', sendChat);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendChat(); }
    });
    // Автоперевод в верхний регистр для удобства ввода ID
    peerInput.addEventListener('input', () => {
      peerInput.value = peerInput.value.toUpperCase();
    });

    // === WebRTC звонки через C# WebSocket-релей ===
    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    const vMyCam = document.getElementById('video-my-camera');
    const vMyScreen = document.getElementById('video-my-screen');
    const vPeerCam = document.getElementById('video-peer-camera');
    const vPeerScreen = document.getElementById('video-peer-screen');

    let pc = null;
    let localStream = null;
    let remoteMedia = null;        // 'camera' | 'voice' | 'screen' — тип текущего потока
    let pendingCandidates = [];

    function peerVideoFor(media) {
      return (media === 'screen') ? vPeerScreen : vPeerCam;
    }

    function stopLocalMedia() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      vMyCam.srcObject = null;
      vMyScreen.srcObject = null;
    }

    function createPeerConnection() {
      pc = new RTCPeerConnection(rtcConfig);

      if (localStream) {
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      }

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          const target = peerInput.value.trim().toUpperCase();
          sendToServer({ type: 'signal', from: myId, to: target || null, kind: 'candidate', media: remoteMedia, candidate: e.candidate });
        }
      };

      pc.ontrack = (e) => {
        peerVideoFor(remoteMedia || 'camera').srcObject = e.streams[0];
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'connected') addSystemMessage('📞 Соединение установлено');
        else if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) addSystemMessage('🔌 Соединение завершено');
      };

      return pc;
    }

    // Исходящий звонок: media = 'camera' | 'voice' | 'screen'
    async function startCall(media) {
      if (!myId) { addSystemMessage('⚠️ Нет соединения с сервером — подождите переподключения'); return; }
      const target = peerInput.value.trim().toUpperCase();
      if (!target) { addSystemMessage('⚠️ Сначала введите ID собеседника в поле выше'); return; }

      addSystemMessage('📞 Начинаем звонок (' + media + ') → ' + target + ' ...');

      stopLocalMedia();
      try {
        if (media === 'screen') {
          localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        } else {
          localStream = await navigator.mediaDevices.getUserMedia(
            media === 'voice' ? { audio: true } : { video: true, audio: true });
        }
      } catch (err) {
        addSystemMessage('⚠️ Не удалось получить доступ к устройству: ' + err.message);
        return;
      }

      remoteMedia = media;
      if (media === 'screen') vMyScreen.srcObject = localStream;
      else vMyCam.srcObject = localStream;

      createPeerConnection();
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      sendToServer({ type: 'signal', from: myId, to: target, kind: 'offer', media: remoteMedia, sdp: offer.sdp });
      addSystemMessage('📤 Запрос на звонок отправлен → ' + target);
    }

    // Обработка входящих сигналов от собеседника
    async function handleSignal(msg) {
      if (!pc && msg.kind !== 'offer') return;

      if (msg.kind === 'offer') {
        remoteMedia = msg.media || 'camera';
        createPeerConnection();
        await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
        for (const c of pendingCandidates) { try { await pc.addIceCandidate(c); } catch {} }
        pendingCandidates = [];

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendToServer({ type: 'signal', from: myId, to: msg.from, kind: 'answer', media: remoteMedia, sdp: answer.sdp });
        addSystemMessage('📥 Входящий звонок от ' + msg.from + ' (' + remoteMedia + ')');
      }
      else if (msg.kind === 'answer') {
        await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
        for (const c of pendingCandidates) { try { await pc.addIceCandidate(c); } catch {} }
        pendingCandidates = [];
      }
      else if (msg.kind === 'candidate') {
        const cand = msg.candidate;
        if (pc && pc.remoteDescription) { try { await pc.addIceCandidate(cand); } catch {} }
        else pendingCandidates.push(cand);
      }
    }

    // Сброс звонка
    function resetCall() {
      if (pc) { try { pc.close(); } catch {} pc = null; }
      stopLocalMedia();
      vPeerCam.srcObject = null;
      vPeerScreen.srcObject = null;
      pendingCandidates = [];
      remoteMedia = null;
      addSystemMessage('❌ Звонок сброшен');
    }

    document.getElementById('btn-call-video').addEventListener('click', () => startCall('camera'));
    document.getElementById('btn-call-voice').addEventListener('click', () => startCall('voice'));
    document.getElementById('btn-call-screen').addEventListener('click', () => startCall('screen'));
    document.getElementById('btn-reset').addEventListener('click', resetCall);

    // Запускаем соединение при загрузке страницы
    connectToServer();

    // Слушаем двойной клик глобально по всей странице
    document.addEventListener('dblclick', (event) => {
      // Автоматически определяем конкретное видео, на которое нажал пользователь
      const videoElement = event.target.closest('video');
      
      // Если кликнули не по окну трансляции — игнорируем
      if (!videoElement) return; 

      // Переключатель режима Fullscreen API
      if (!document.fullscreenElement) {
        // Разворачиваем именно то уникальное видео, по которому кликнули
        videoElement.requestFullscreen().catch((err) => {
          console.error(`Не удалось развернуть окно: ${err.message}`);
        });
      } else {
        // Если окно уже во весь экран — возвращаем его в сетку
        document.exitFullscreen();
      }
    });
  </script>

</body>
</html>
